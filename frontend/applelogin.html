<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Apple Login | Alaska Tour & Travel</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="alternate icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png" type="image/png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#041a32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Alaska Tour"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="config.js"></script><script src="api.js"></script><script src="pwa.js"></script></head><body><main style="max-width:500px;margin:15vh auto;text-align:center;font-family:Arial"><h1>Apple Sign-In</h1><p>Demo OAuth entry point. Enter the Apple email used for this demo.</p><input id="email" type="email" placeholder="you@example.com" style="padding:12px;width:80%"><button onclick="go()" style="padding:12px 20px;margin:15px">Continue</button></main><script>async function go(){try{let e=email.value;let d=await API.social("apple",e,e.split("@")[0]);localStorage.setItem("alaskaToken",d.token);localStorage.setItem("alaskaUserName",d.user.name);localStorage.setItem("alaskaUserEmail",d.user.email);localStorage.setItem("alaskaUserRole",d.user.role||"user");location.href="index.html"}catch(x){alert(x.message)}}</script></body></html>
