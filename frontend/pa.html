
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Details | Alaska Tour & Travel</title>

    <!-- Favicon & PWA Metadata -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#041a32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alaska Tour">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="profile.js"></script>
    <script src="pwa.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #041a32, #075b9d);
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #dceeff;
        }

        /* CONTAINER */

        .container {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 20px;
        }

        /* STEPS */

        .steps {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .step {
            padding: 11px 24px;
            background: #dfe7ef;
            color: #777;
            border-radius: 30px;
            font-weight: bold;
        }

        .step.active {
            background: #0879d1;
            color: white;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #06345f;
            margin-bottom: 25px;
        }

        .title i {
            color: #0879d1;
            font-size: 23px;
        }

        /* FLIGHT ROUTE */

        .route {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .airport {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .airport small {
            color: #777;
        }

        .airport .code {
            font-size: 34px;
            font-weight: bold;
            color: #06345f;
        }

        .airport .city {
            font-size: 17px;
        }

        .plane {
            color: #0879d1;
            font-size: 25px;
        }

        .line {
            height: 2px;
            background: #c5dcec;
            margin: 10px 30px;
        }

        /* FLIGHT DETAILS */

        .flight-details {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: #f2f8fd;
            border-radius: 12px;
            padding: 20px;
            gap: 15px;
        }

        .detail {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail span {
            color: #777;
            font-size: 13px;
        }

        .detail strong {
            color: #172033;
        }

        /* PRICE */

        .price-box {
            margin-top: 22px;
            padding: 18px;
            background: #eef7ff;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-box span {
            color: #555;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            color: #0879d1;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #ccd6df;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #0879d1;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            padding: 15px 28px;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
        }

        .back {
            background: #e2e7ec;
            color: #333;
        }

        .payment {
            background: linear-gradient(135deg, #0879d1, #034d8b);
            color: white;
            flex: 1;
            max-width: 300px;
        }

        /* MOBILE */

        @media(max-width:700px) {

            .steps {
                flex-direction: column;
            }

            .route {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .flight-details {
                grid-template-columns: repeat(2,1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .buttons {
                flex-direction: column;
            }

            .payment {
                max-width: none;
            }

        }

    </style>
</head>


<body>

<header>

    <a href="index.html" class="logo" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:white;">
        <div class="logo-icon" style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg, #13b8a8, #0879d1);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(19,184,168,0.4);color:white;flex-shrink:0;"><i class="fa-solid fa-plane-departure"></i></div>
        <div class="logo-text">
            <strong style="font-size:18px;font-weight:900;letter-spacing:0.8px;display:block;color:#ffffff;line-height:1.2;">ALASKA</strong>
            <span style="font-size:10px;color:#94b8d7;letter-spacing:1.5px;display:block;font-weight:600;">TOUR &amp; TRAVEL</span>
        </div>
    </a>

    <!-- Profile Avatar -->
    <div id="profile-slot"></div>

</header>


<div class="container">


    <!-- STEPS -->

    <div class="steps">

        <div class="step active">
            1. Booking Details
        </div>

        <div class="step">
            2. Payment
        </div>

        <div class="step">
            3. Confirmation
        </div>

    </div>







    <!-- TRIP SUMMARY CARD -->
    <section class="card" id="tripSummaryCard" style="background: white; border: 1px solid #e2e8f0; border-radius: 18px; padding: 24px; margin-bottom: 25px; box-shadow: 0 8px 25px rgba(0,0,0,.06);">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 18px; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span id="tripTypeBadge" style="background: #e0f2fe; color: #0369a1; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-plane" id="tripTypeIcon"></i> <span id="tripTypeName">Flight Booking</span>
          </span>
          <strong id="flight" style="font-size: 16px; color: #041a32;">AS101 Alaska Airlines</strong>
        </div>
        <div style="font-size: 13px; color: #64748b; font-weight: 600;">
          Class / Berth: <strong id="class" style="color: #0f172a;">Economy</strong>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1.5fr 1fr 1.5fr; align-items: center; text-align: center; margin-bottom: 18px;">
        <div style="text-align: left;">
          <div style="font-size: 22px; font-weight: 900; color: #041a32;" id="departure">01:15</div>
          <div style="font-size: 14.5px; font-weight: 700; color: #334155;"><span id="from">Mumbai</span> (<span id="fromCode">BOM</span>)</div>
          <small id="date" style="color: #64748b; font-size: 12px;">15-Sep-2026</small>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <i class="fa-solid fa-arrow-right" style="color: #0879d1; font-size: 18px;"></i>
          <span style="font-size: 11.5px; font-weight: 700; color: #0879d1;" id="tripStatusTag">Confirmed Journey</span>
        </div>

        <div style="text-align: right;">
          <div style="font-size: 22px; font-weight: 900; color: #041a32;" id="arrival">10:35</div>
          <div style="font-size: 14.5px; font-weight: 700; color: #334155;"><span id="to">Anchorage</span> (<span id="toCode">ANC</span>)</div>
          <small style="color: #64748b; font-size: 12px;">1 Passenger</small>
        </div>
      </div>

      <div style="border-top: 1px solid #f1f5f9; padding-top: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 13px; color: #64748b; font-weight: 600;">Total Payable Fare:</span>
        <span id="price" style="font-size: 24px; font-weight: 900; color: #0879d1;">₹68,999</span>
      </div>
    </section>

    <!-- PASSENGER DETAILS -->
    <section class="card">

        <div class="title">

            <i class="fa-solid fa-user"></i>

            <h2>
                Passenger Details
            </h2>

        </div>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    placeholder="Enter first name">

            </div>


            <div class="form-group">

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    placeholder="Enter last name">

            </div>


            <div class="form-group">

                <label>
                    Date of Birth
                </label>

                <input type="date">

            </div>


            <div class="form-group">

                <label>
                    Gender
                </label>

                <select>

                    <option value="">
                        Select Gender
                    </option>

                    <option>
                        Male
                    </option>

                    <option>
                        Female
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Nationality
                </label>

                <input
                    type="text"
                    placeholder="Enter nationality">

            </div>


            <div class="form-group">

                <label>
                    Passport Number
                </label>

                <input
                    type="text"
                    placeholder="Enter passport number">

            </div>


            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    placeholder="Enter mobile number">

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter email address">

            </div>


            <div class="form-group full">

                <label>
                    Address
                </label>

                <input
                    type="text"
                    placeholder="Enter your address">

            </div>

        </div>

    </section>



    <!-- BUTTONS -->
    <div class="buttons">
        <a href="seacht.html" class="btn back" id="btnBack">
            <i class="fa-solid fa-arrow-left"></i>
            <span id="btnBackText">Back to Flights</span>
        </a>

        <button
            type="button"
            class="btn payment"
            id="btnPayment"
            onclick="goPayment()">
            <span>Continue to Payment</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

</div>

<script>
    /* GET FLIGHT/TRAIN/BUS DETAILS FROM URL OR PENDING BOOKING */
    const params = new URLSearchParams(window.location.search);
    const savedBooking = JSON.parse(localStorage.getItem("pendingBooking") || "{}");
    const bookingType = params.get("type") || savedBooking.type || "flight";

    // Configure Type Badges & Back Button
    const btnBack = document.getElementById("btnBack");
    const btnBackText = document.getElementById("btnBackText");
    const badge = document.getElementById("tripTypeBadge");
    const icon = document.getElementById("tripTypeIcon");
    const typeName = document.getElementById("tripTypeName");
    const statusTag = document.getElementById("tripStatusTag");

    if (bookingType === "train") {
      btnBack.href = "train.html";
      btnBackText.textContent = "Back to Trains";
      badge.style.background = "#fef3c7";
      badge.style.color = "#b45309";
      icon.className = "fa-solid fa-train";
      typeName.textContent = "Indian Railways Ticket";
      statusTag.textContent = "IRCTC Reserved (CNF)";
    } else if (bookingType === "bus") {
      btnBack.href = "bus.html";
      btnBackText.textContent = "Back to Buses";
      badge.style.background = "#fee2e2";
      badge.style.color = "#b91c1c";
      icon.className = "fa-solid fa-bus";
      typeName.textContent = "Intercity Bus Ticket";
      statusTag.textContent = "Confirmed Berth/Seat";
    } else {
      btnBack.href = "seacht.html";
      btnBackText.textContent = "Back to Flights";
      badge.style.background = "#e0f2fe";
      badge.style.color = "#0369a1";
      icon.className = "fa-solid fa-plane";
      typeName.textContent = "Flight Booking";
      statusTag.textContent = "Confirmed Journey";
    }

    document.getElementById("from").textContent =
        params.get("from") || savedBooking.from || "Mumbai";

    document.getElementById("fromCode").textContent =
        params.get("fromCode") || savedBooking.fromCode || (bookingType === "train" ? "MMCT" : "BOM");

    document.getElementById("to").textContent =
        params.get("to") || savedBooking.to || (bookingType === "train" ? "New Delhi" : "Anchorage");

    document.getElementById("toCode").textContent =
        params.get("toCode") || savedBooking.toCode || (bookingType === "train" ? "NDLS" : "ANC");

    document.getElementById("date").textContent =
        params.get("date") || savedBooking.travelDate || "15-Sep-2026";

    document.getElementById("departure").textContent =
        params.get("departure") || savedBooking.departure || "06:00";

    document.getElementById("arrival").textContent =
        params.get("arrival") || savedBooking.arrival || "14:00";

    document.getElementById("flight").textContent =
        params.get("flight") || savedBooking.flight || (bookingType === "train" ? "12951 Tejas Rajdhani" : "AS101 Alaska Airlines");

    document.getElementById("class").textContent =
        params.get("class") || savedBooking.flightClass || "Economy";

    const price =
        Number(params.get("price")) || Number(savedBooking.totalPrice) || Number(savedBooking.price) || (bookingType === "train" ? 2280 : 68999);

    document.getElementById("price").textContent =
        "₹" + price.toLocaleString("en-IN");

    /* Pre-fill user details if logged in */
    const storedName  = localStorage.getItem("alaskaUserName") || "";
    const storedEmail = localStorage.getItem("alaskaUserEmail") || "";
    const storedPhone = localStorage.getItem("alaskaUserPhone") || "";
    const firstNameInput = document.querySelector('input[placeholder="Enter first name"]');
    const lastNameInput  = document.querySelector('input[placeholder="Enter last name"]');
    const emailInput     = document.querySelector('input[placeholder="Enter email address"]');
    const phoneInput     = document.querySelector('input[placeholder="Enter mobile number"]');

    if (storedName) {
      const parts = storedName.split(" ");
      if (firstNameInput && !firstNameInput.value) firstNameInput.value = parts[0] || "";
      if (lastNameInput && !lastNameInput.value) lastNameInput.value = parts.slice(1).join(" ") || "";
    }
    if (storedEmail && emailInput && !emailInput.value) emailInput.value = storedEmail;
    if (storedPhone && phoneInput && !phoneInput.value) phoneInput.value = storedPhone;

    /* PAYMENT */
    async function goPayment() {
      const q = Object.fromEntries(new URLSearchParams(location.search));

      const fName = document.querySelector('input[placeholder="Enter first name"]')?.value?.trim() || "";
      const lName = document.querySelector('input[placeholder="Enter last name"]')?.value?.trim() || "";
      const fullName = (fName + " " + lName).trim() || localStorage.getItem("alaskaUserName") || "Traveler";
      const email    = document.querySelector('input[placeholder="Enter email address"]')?.value?.trim() || localStorage.getItem("alaskaUserEmail") || "";
      const phone    = document.querySelector('input[placeholder="Enter mobile number"]')?.value?.trim() || localStorage.getItem("alaskaUserPhone") || "";

      const saved = JSON.parse(localStorage.getItem("pendingBooking") || "{}");
      const currentPrice = Number(q.price) || saved.totalPrice || saved.price || price;

      const bookingData = {
        ...saved,
        ...q,
        type: q.type || saved.type || bookingType,
        from: q.from || saved.from || document.getElementById("from").textContent,
        fromCode: q.fromCode || saved.fromCode || document.getElementById("fromCode").textContent,
        to: q.to || saved.to || document.getElementById("to").textContent,
        toCode: q.toCode || saved.toCode || document.getElementById("toCode").textContent,
        travelDate: q.date || saved.travelDate || document.getElementById("date").textContent,
        departure: q.departure || saved.departure || document.getElementById("departure").textContent,
        arrival: q.arrival || saved.arrival || document.getElementById("arrival").textContent,
        flight: q.flight || saved.flight || document.getElementById("flight").textContent,
        airline: q.airline || saved.airline || (bookingType === "train" ? "Indian Railways" : (bookingType === "bus" ? "Intercity Bus" : "Alaska Airlines")),
        flightClass: q.class || saved.flightClass || document.getElementById("class").textContent,
        passengerName: fullName,
        email: email,
        phone: phone,
        totalPrice: currentPrice,
        price: currentPrice,
        status: "pending"
      };

      localStorage.setItem("pendingBooking", JSON.stringify(bookingData));
      window.location.href = "paymen.html";
    }

</script>


</body>

</html>
