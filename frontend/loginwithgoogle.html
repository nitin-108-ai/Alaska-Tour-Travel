<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Google Login | Alaska Tour & Travel</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="alternate icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png" type="image/png"><script src="config.js"></script><script src="api.js"></script></head><body><main style="max-width:500px;margin:15vh auto;text-align:center;font-family:Arial"><h1>Google Sign-In</h1><p>Demo OAuth entry point. Enter the Google email used for this demo.</p><input id="email" type="email" placeholder="you@example.com" style="padding:12px;width:80%"><button onclick="go()" style="padding:12px 20px;margin:15px">Continue</button></main><script>async function go(){try{let e=email.value;let d=await API.social("google",e,e.split("@")[0]);localStorage.setItem("alaskaToken",d.token);localStorage.setItem("alaskaUserName",d.user.name);localStorage.setItem("alaskaUserEmail",d.user.email);localStorage.setItem("alaskaUserRole",d.user.role||"user");location.href="index.html"}catch(x){alert(x.message)}}</script></body></html>
