<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Alaska Tour &amp; Travel</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="logins.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
</head>
<body>

  <div class="travel-card">

    <!-- Left Travel Section -->
    <div class="travel-info">
      <a href="index.html" class="brand" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px;">
        <div class="logo-icon" style="width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #13b8a8, #0879d1); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 12px rgba(19, 184, 168, 0.4); color: white; flex-shrink: 0;"><i class="fa-solid fa-plane-departure"></i></div>
        <div>
          <strong style="font-size: 18px; font-weight: 900; letter-spacing: 0.8px; display: block; line-height: 1.2;">ALASKA</strong>
          <span style="font-size: 10px; color: #94b8d7; letter-spacing: 1.5px; display: block; font-weight: 600;">TOUR &amp; TRAVEL</span>
        </div>
      </a>
      <div class="travel-content">
        <p class="small-title">EXPLORE • DREAM • TRAVEL</p>
        <h1>Create Your<br><span>Adventure.</span></h1>
        <p>Join Alaska Tour &amp; Travel and manage your trips in one place.</p>
      </div>
      <div class="plane">✈</div>
    </div>

    <!-- Sign Up Section -->
    <div class="login-section">
      <h2>Create Account</h2>
      <p class="welcome">Start your journey today</p>

      <form id="signupForm">

        <div class="input-group">
          <label for="name">Name</label>
          <div class="input-wrapper">
            <span>👤</span>
            <input id="name" required placeholder="Your name">
          </div>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span>✉</span>
            <input id="email" type="email" required placeholder="you@example.com">
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span>🔒</span>
            <input id="password" type="password" minlength="6" required placeholder="At least 6 characters">
          </div>
        </div>

        <p id="message"></p>

        <button type="submit" class="login-btn">Create Account ✈</button>

      </form>

      <p class="signup">Already have an account? <a href="logintravel.html">Log In</a></p>
    </div>

  </div>

  <script>
    const msgEl     = document.getElementById("message");
    const signupBtn = document.querySelector(".login-btn");

    document.getElementById("signupForm").onsubmit = async (e) => {
      e.preventDefault();
      msgEl.textContent = "";
      msgEl.className   = "";

      signupBtn.disabled    = true;
      signupBtn.textContent = "Creating account…";

      try {
        const d = await API.register(
          document.getElementById("name").value.trim(),
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );

        // Save token + user info
        localStorage.setItem("alaskaToken",     d.token);
        localStorage.setItem("alaskaUserName",  d.user.name);
        localStorage.setItem("alaskaUserEmail", d.user.email);
        localStorage.setItem("alaskaUserRole",  d.user.role || "user");
        localStorage.setItem("alaskaUserId",    d.user.id);

        msgEl.textContent = "Account created! Redirecting to Alaska Travel…";
        msgEl.className   = "success";

        setTimeout(() => location.href = "index.html", 500);
      } catch (err) {
        msgEl.textContent = err.message || "Registration failed. Please try again.";
        msgEl.className   = "error";

        signupBtn.disabled   = false;
        signupBtn.textContent = "Create Account ✈";
      }
    };
  </script>

</body>
</html>
